<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocalAI — Ollama Chat</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="topbar"><div><h1>LocalAI</h1><p>Private AI chat powered by Ollama</p></div><button id="settingsBtn" class="secondary">⚙ Settings</button></header>
<main class="chat-shell">
<div id="status" class="status">Checking Ollama…</div>
<section id="messages" class="messages" aria-live="polite"><div class="empty"><h2>Talk to your local AI.</h2><p>Nothing leaves your computer. Choose an Ollama model and start chatting.</p></div></section>
<form id="chatForm" class="composer"><textarea id="prompt" rows="2" placeholder="Message your local AI…" autocomplete="off"></textarea><button id="sendBtn" type="submit">Send</button></form>
</main>
</div>
<dialog id="settings">
<form method="dialog" id="settingsForm" class="settings">
<div class="settings-head"><h2>Settings</h2><button type="button" id="closeSettings" class="icon">✕</button></div>
<label>Ollama URL<input id="ollamaUrl" value="http://localhost:11434" spellcheck="false"></label>
<label>Model<select id="model"></select></label>
<label>System Prompt<textarea id="systemPrompt" rows="6" placeholder="You are a helpful assistant."></textarea></label>
<label>Temperature<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"></label>
<div class="settings-actions"><button type="button" id="refreshModels" class="secondary">Refresh models</button><button type="button" id="clearChat" class="danger">Clear chat</button><button type="submit">Save</button></div>
</form>
</dialog>
<script src="app.js"></script>
</body></html>
